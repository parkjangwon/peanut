openapi: 3.1.0
info:
  title: Peanut API
  version: 0.2.0
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: >
    Peanut's stable backend-platform contract. Public product APIs are app-scoped
    under /api/apps/{app_id}/... and require an X-Peanut-Api-Key. Admin and
    operator APIs require an admin bearer token. Legacy global auth, data,
    storage, push, and function paths are not part of the runtime API surface.
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Process health.
  /api/ready:
    get:
      operationId: getReady
      summary: Readiness and platform invariant check
      security: []
      responses:
        "200":
          description: Database, storage, default app, schema, and runtime checks.
  /api/bootstrap/admin:
    post:
      operationId: bootstrapAdmin
      summary: Create the first platform admin
      description: Succeeds only while the installation has no admin users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Admin created and logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/apps:
    get:
      operationId: listApps
      summary: List apps
      responses:
        "200":
          description: App list.
    post:
      operationId: createApp
      summary: Create an app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppRequest"
      responses:
        "201":
          description: Created app.
  /api/apps/{app_id}:
    get:
      operationId: getApp
      summary: Get app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App summary.
    patch:
      operationId: updateApp
      summary: Update app metadata
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Updated app.
    delete:
      operationId: deleteApp
      summary: Soft-delete an app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App deleted.
  /api/apps/{app_id}/keys:
    get:
      operationId: listAppKeys
      summary: List app keys
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App key summaries.
    post:
      operationId: createAppKey
      summary: Create an app key
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppKeyRequest"
      responses:
        "201":
          description: Key metadata plus one-time plaintext key.
  /api/apps/{app_id}/auth/register:
    post:
      operationId: registerAppUser
      summary: Register an app user
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: User registered.
  /api/apps/{app_id}/auth/login:
    post:
      operationId: loginAppUser
      summary: Login an app user
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Access and refresh token pair.
  /api/apps/{app_id}/auth/refresh:
    post:
      operationId: refreshAppSession
      summary: Rotate an app refresh token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Rotated token pair.
  /api/apps/{app_id}/auth/logout:
    post:
      operationId: logoutAppUser
      summary: Revoke an app refresh token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Session revoked.
  /api/apps/{app_id}/auth/me:
    get:
      operationId: getAppCurrentUser
      summary: Return the current app user
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Current user.
  /api/apps/{app_id}/auth/change-password:
    post:
      operationId: changeAppPassword
      summary: Change the current app user's password
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Password updated.
  /api/apps/{app_id}/auth/forgot-password:
    post:
      operationId: forgotAppPassword
      summary: Request an app-scoped password reset token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Reset request accepted.
  /api/apps/{app_id}/auth/reset-password:
    post:
      operationId: resetAppPassword
      summary: Reset an app user's password
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Password reset complete.
  /api/apps/{app_id}/auth/sessions:
    get:
      operationId: listAppAuthSessions
      summary: List current app user sessions
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Session list.
  /api/apps/{app_id}/auth/sessions/revoke-all:
    post:
      operationId: revokeAllAppAuthSessions
      summary: Revoke all current app user sessions
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Sessions revoked.
  /api/apps/{app_id}/auth/sessions/{session_id}:
    delete:
      operationId: revokeAppAuthSession
      summary: Revoke one current app user session
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked.
  /api/apps/{app_id}/auth/events:
    get:
      operationId: listAppAuthEvents
      summary: List current app user auth events
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Auth event list.
  /api/apps/{app_id}/data/tables:
    get:
      operationId: listAppDataTables
      summary: List app data tables
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Data table list.
    post:
      operationId: createAppDataTable
      summary: Create an app data table
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Data table created.
  /api/apps/{app_id}/data/tables/{table}/rows:
    get:
      operationId: listAppDataRows
      summary: List rows
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Table"
      responses:
        "200":
          description: Row list.
    post:
      operationId: createAppDataRow
      summary: Create a row
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Table"
      responses:
        "201":
          description: Row created.
  /api/apps/{app_id}/storage/buckets:
    get:
      operationId: listStorageBuckets
      summary: List storage buckets
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Bucket list.
    post:
      operationId: createStorageBucket
      summary: Create a storage bucket
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Bucket created.
  /api/apps/{app_id}/storage/buckets/{bucket}/objects:
    get:
      operationId: listStorageObjects
      summary: List objects in a bucket
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Object list.
  /api/apps/{app_id}/storage/buckets/{bucket}/objects/{key}:
    get:
      operationId: getStorageObject
      summary: Download an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Object bytes.
    put:
      operationId: putStorageObject
      summary: Upload an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "201":
          description: Object stored.
    delete:
      operationId: deleteStorageObject
      summary: Delete an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Object deleted.
  /api/apps/{app_id}/functions:
    get:
      operationId: listAppFunctions
      summary: List functions
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Function list.
    post:
      operationId: createAppFunction
      summary: Create or publish a function
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Function created.
  /api/apps/{app_id}/functions/endpoints/{endpoint_slug}:
    post:
      operationId: invokeAppFunction
      summary: Invoke a function endpoint
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: endpoint_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Function result.
        "202":
          description: Async invocation accepted.
  /api/apps/{app_id}/push/subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: List push subscriptions
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Subscription list.
    post:
      operationId: createPushSubscription
      summary: Create push subscription
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Subscription created.
  /api/apps/{app_id}/push/messages:
    post:
      operationId: enqueuePushMessage
      summary: Queue a push message
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Message queued.
  /api/apps/{app_id}/push/diagnostics:
    get:
      operationId: getAppPushDiagnostics
      summary: Return app-scoped push diagnostics
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Push diagnostics.
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: Admin user list.
  /api/admin/backups:
    get:
      operationId: listBackups
      summary: List backups
      responses:
        "200":
          description: Backup list.
    post:
      operationId: createBackup
      summary: Create a backup
      responses:
        "201":
          description: Backup created.
  /api/admin/ops/diagnostics:
    get:
      operationId: getPlatformDiagnostics
      summary: Return platform readiness diagnostics
      responses:
        "200":
          description: Platform diagnostics.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    appKeyAuth:
      type: apiKey
      in: header
      name: X-Peanut-Api-Key
  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
    Table:
      name: table
      in: path
      required: true
      schema:
        type: string
    Bucket:
      name: bucket
      in: path
      required: true
      schema:
        type: string
    ObjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
    UserSummary:
      type: object
      required: [id, app_id, email, is_active, is_admin]
      properties:
        id:
          type: string
        app_id:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        is_admin:
          type: boolean
    CreateAppRequest:
      type: object
      required: [name, display_name]
      properties:
        name:
          type: string
        display_name:
          type: string
    CreateAppKeyRequest:
      type: object
      required: [name, key_type]
      properties:
        name:
          type: string
        key_type:
          type: string
          enum: [client, server, admin]
        scopes:
          type: array
          items:
            type: string
        expires_in_days:
          type: integer
        rate_limit_per_minute:
          type: integer
