openapi: 3.1.0
info:
  title: Peanut API
  version: 0.2.0
  license:
    name: UNLICENSED
    identifier: UNLICENSED
  description: >
    Peanut's stable backend-platform contract. Public product APIs are app-scoped
    under /api/apps/{app_id}/... and require an X-Peanut-Api-Key. Admin and
    operator APIs require an admin bearer token. Legacy global auth, data,
    storage, push, and function paths are not part of the runtime API surface.
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Process health.
  /api/ready:
    get:
      operationId: getReady
      summary: Readiness and platform invariant check
      security: []
      responses:
        "200":
          description: Database, storage, default app, schema, and runtime checks.
  /api/bootstrap/admin:
    post:
      operationId: bootstrapAdmin
      summary: Create the first platform admin
      description: Succeeds only while the installation has no admin users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Admin created and logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          $ref: "#/components/responses/Error"
  /api/admin/auth/login:
    post:
      operationId: loginAdmin
      summary: Login a platform admin for the embedded console
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Admin access and refresh token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/admin/auth/refresh:
    post:
      operationId: refreshAdminSession
      summary: Rotate an admin console refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Rotated admin token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/admin/auth/logout:
    post:
      operationId: logoutAdmin
      summary: Revoke an admin console refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Admin session revoked.
  /api/admin/auth/me:
    get:
      operationId: getAdminSession
      summary: Return the current platform admin
      responses:
        "200":
          description: Current admin session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/admin/beta-invites:
    get:
      operationId: listBetaInvites
      summary: List invite-only beta signup invites
      responses:
        "200":
          description: Beta invite summaries.
    post:
      operationId: createBetaInvite
      summary: Create an invite-only beta signup code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBetaInviteRequest"
      responses:
        "201":
          description: Invite summary plus one-time plaintext invite code.
  /api/beta/signup:
    post:
      operationId: betaSignup
      summary: Consume a beta invite and create an organization owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaSignupRequest"
      responses:
        "201":
          description: Organization owner session and membership.
        "400":
          description: Invalid or exhausted invite.
  /api/orgs:
    get:
      operationId: listOrganizations
      summary: List organizations visible to the console user
      responses:
        "200":
          description: Organization list.
  /api/orgs/{org_id}/usage:
    get:
      operationId: getOrganizationUsage
      summary: Return organization plan and quota usage
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage summary.
  /api/orgs/{org_id}/quotas:
    post:
      operationId: setOrganizationQuota
      summary: Override one public-beta quota for an organization
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQuotaRequest"
      responses:
        "200":
          description: Updated quota summary.
  /api/admin/orgs/{org_id}/suspend:
    post:
      operationId: suspendOrganization
      summary: Suspend an organization and block SDK writes
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: Organization suspended.
  /api/admin/orgs/{org_id}/unsuspend:
    post:
      operationId: unsuspendOrganization
      summary: Unsuspend an organization
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization unsuspended.
  /api/admin/apps/{app_id}/suspend:
    post:
      operationId: suspendApp
      summary: Suspend an app and block SDK writes
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: App suspended.
  /api/admin/apps/{app_id}/unsuspend:
    post:
      operationId: unsuspendApp
      summary: Unsuspend an app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App unsuspended.
  /api/apps:
    get:
      operationId: listApps
      summary: List apps
      responses:
        "200":
          description: App list.
    post:
      operationId: createApp
      summary: Create an app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppRequest"
      responses:
        "201":
          description: Created app.
  /api/apps/{app_id}:
    get:
      operationId: getApp
      summary: Get app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App summary.
    patch:
      operationId: updateApp
      summary: Update app metadata
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Updated app.
    delete:
      operationId: deleteApp
      summary: Soft-delete an app
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App deleted.
  /api/apps/{app_id}/keys:
    get:
      operationId: listAppKeys
      summary: List app keys
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App key summaries.
    post:
      operationId: createAppKey
      summary: Create an app key
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppKeyRequest"
      responses:
        "201":
          description: Key metadata plus one-time plaintext key.
  /api/apps/{app_id}/auth/register:
    post:
      operationId: registerAppUser
      summary: Register an app user
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: User registered.
  /api/apps/{app_id}/auth/login:
    post:
      operationId: loginAppUser
      summary: Login an app user
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Access and refresh token pair.
  /api/apps/{app_id}/auth/refresh:
    post:
      operationId: refreshAppSession
      summary: Rotate an app refresh token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Rotated token pair.
  /api/apps/{app_id}/auth/logout:
    post:
      operationId: logoutAppUser
      summary: Revoke an app refresh token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Session revoked.
  /api/apps/{app_id}/auth/me:
    get:
      operationId: getAppCurrentUser
      summary: Return the current app user
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Current user.
  /api/apps/{app_id}/auth/change-password:
    post:
      operationId: changeAppPassword
      summary: Change the current app user's password
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Password updated.
  /api/apps/{app_id}/auth/forgot-password:
    post:
      operationId: forgotAppPassword
      summary: Request an app-scoped password reset token
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Reset request accepted.
  /api/apps/{app_id}/auth/reset-password:
    post:
      operationId: resetAppPassword
      summary: Reset an app user's password
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Password reset complete.
  /api/apps/{app_id}/auth/sessions:
    get:
      operationId: listAppAuthSessions
      summary: List current app user sessions
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Session list.
  /api/apps/{app_id}/auth/sessions/revoke-all:
    post:
      operationId: revokeAllAppAuthSessions
      summary: Revoke all current app user sessions
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Sessions revoked.
  /api/apps/{app_id}/auth/sessions/{session_id}:
    delete:
      operationId: revokeAppAuthSession
      summary: Revoke one current app user session
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked.
  /api/apps/{app_id}/auth/events:
    get:
      operationId: listAppAuthEvents
      summary: List current app user auth events
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Auth event list.
  /api/apps/{app_id}/auth/users:
    get:
      operationId: listAdminAppUsers
      summary: List app users for the admin console
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: App user list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
  /api/apps/{app_id}/auth/users/{user_id}:
    get:
      operationId: getAdminAppUser
      summary: Get an app user for the admin console
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: App user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/apps/{app_id}/auth/users/{user_id}/activate:
    post:
      operationId: activateAdminAppUser
      summary: Activate an app user
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User activated.
  /api/apps/{app_id}/auth/users/{user_id}/deactivate:
    post:
      operationId: deactivateAdminAppUser
      summary: Deactivate an app user
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deactivated.
  /api/apps/{app_id}/auth/users/{user_id}/sessions:
    get:
      operationId: listAdminAppUserSessions
      summary: List app user sessions for the admin console
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
  /api/apps/{app_id}/auth/users/{user_id}/sessions/{session_id}:
    delete:
      operationId: revokeAdminAppUserSession
      summary: Revoke an app user session from the admin console
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/UserId"
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session revoked.
  /api/apps/{app_id}/data/tables:
    get:
      operationId: listAppDataTables
      summary: List app data tables
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Data table list.
    post:
      operationId: createAppDataTable
      summary: Create an app data table
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Data table created.
  /api/apps/{app_id}/data/tables/{table}/rows:
    get:
      operationId: listAppDataRows
      summary: List rows
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Table"
      responses:
        "200":
          description: Row list.
    post:
      operationId: createAppDataRow
      summary: Create a row
      security:
        - appKeyAuth: []
          bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Table"
      responses:
        "201":
          description: Row created.
  /api/apps/{app_id}/storage/buckets:
    get:
      operationId: listStorageBuckets
      summary: List storage buckets
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Bucket list.
    post:
      operationId: createStorageBucket
      summary: Create a storage bucket
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Bucket created.
  /api/apps/{app_id}/storage/buckets/{bucket}/objects:
    get:
      operationId: listStorageObjects
      summary: List objects in a bucket
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Object list.
  /api/apps/{app_id}/storage/buckets/{bucket}/objects/{key}:
    get:
      operationId: getStorageObject
      summary: Download an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Object bytes.
    put:
      operationId: putStorageObject
      summary: Upload an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "201":
          description: Object stored.
    delete:
      operationId: deleteStorageObject
      summary: Delete an object
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/ObjectKey"
      responses:
        "200":
          description: Object deleted.
  /api/apps/{app_id}/functions:
    get:
      operationId: listAppFunctions
      summary: List functions
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Function list.
    post:
      operationId: createAppFunction
      summary: Create or publish a function
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Function created.
  /api/apps/{app_id}/functions/{name}:
    get:
      operationId: getAppFunction
      summary: Get a function
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
      responses:
        "200":
          description: Function detail.
    patch:
      operationId: updateAppFunction
      summary: Update a function and create a new active version
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
      responses:
        "200":
          description: Function updated.
    delete:
      operationId: deleteAppFunction
      summary: Delete a function
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
      responses:
        "200":
          description: Function deleted.
  /api/apps/{app_id}/functions/{name}/versions:
    get:
      operationId: listAppFunctionVersions
      summary: List function versions
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
      responses:
        "200":
          description: Function versions.
  /api/apps/{app_id}/functions/{name}/versions/{version_number}/rollback:
    post:
      operationId: rollbackAppFunctionVersion
      summary: Roll back the active function version
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
        - name: version_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Function rolled back.
  /api/apps/{app_id}/functions/{name}/invocations:
    get:
      operationId: listAppFunctionInvocations
      summary: List function invocations
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
      responses:
        "200":
          description: Function invocations.
  /api/apps/{app_id}/functions/{name}/invocations/{invocation_id}/retry:
    post:
      operationId: retryAppFunctionInvocation
      summary: Retry a function invocation
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/FunctionName"
        - name: invocation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Function retry result.
  /api/apps/{app_id}/functions/editor/lint:
    post:
      operationId: lintFunctionSource
      summary: Lint function source
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Lint result.
  /api/apps/{app_id}/functions/editor/dry-run:
    post:
      operationId: dryRunFunctionSource
      summary: Dry-run function source without saving it
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Dry-run result.
  /api/apps/{app_id}/functions/endpoints/{endpoint_slug}:
    post:
      operationId: invokeAppFunction
      summary: Invoke a function endpoint
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: endpoint_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Function result.
        "202":
          description: Async invocation accepted.
  /api/apps/{app_id}/push/subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: List push subscriptions
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Subscription list.
    post:
      operationId: createPushSubscription
      summary: Create push subscription
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Subscription created.
  /api/apps/{app_id}/push/subscriptions/{subscription_id}:
    delete:
      operationId: deletePushSubscription
      summary: Delete a push subscription
      parameters:
        - $ref: "#/components/parameters/AppId"
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription deleted.
  /api/apps/{app_id}/push/messages:
    post:
      operationId: enqueuePushMessage
      summary: Queue a push message
      security:
        - appKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "201":
          description: Message queued.
  /api/apps/{app_id}/push/test-message:
    post:
      operationId: enqueuePushTestMessage
      summary: Queue a console test push message
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueuePushRequest"
      responses:
        "201":
          description: Test message queued.
  /api/apps/{app_id}/push/diagnostics:
    get:
      operationId: getAppPushDiagnostics
      summary: Return app-scoped push diagnostics
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Push diagnostics.
  /api/admin/users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: Admin user list.
  /api/admin/users/{user_id}/role:
    patch:
      operationId: updateAdminRole
      summary: Update a platform admin role
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminRoleRequest"
      responses:
        "200":
          description: Admin role updated.
  /api/admin/backups:
    get:
      operationId: listBackups
      summary: List backups
      responses:
        "200":
          description: Backup list.
    post:
      operationId: createBackup
      summary: Create a backup
      responses:
        "201":
          description: Backup created.
  /api/admin/backups/restore-pending:
    get:
      operationId: getRestorePending
      summary: Inspect pending backup restore state
      responses:
        "200":
          description: Pending restore state.
    delete:
      operationId: clearRestorePending
      summary: Clear pending backup restore state
      responses:
        "200":
          description: Pending restore cleared.
  /api/admin/backups/{backup_name}/download:
    get:
      operationId: downloadBackup
      summary: Download a SQLite backup
      parameters:
        - name: backup_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Backup file.
  /api/admin/backups/{backup_name}/restore:
    post:
      operationId: restoreBackup
      summary: Schedule a backup restore for the next restart
      parameters:
        - name: backup_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupRequest"
      responses:
        "200":
          description: Restore scheduled.
  /api/admin/ops/metrics:
    get:
      operationId: getOpsMetrics
      summary: Return production operation metrics
      responses:
        "200":
          description: Ops metrics.
  /api/admin/ops/diagnostics:
    get:
      operationId: getPlatformDiagnostics
      summary: Return platform readiness diagnostics
      responses:
        "200":
          description: Platform diagnostics.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    appKeyAuth:
      type: apiKey
      in: header
      name: X-Peanut-Api-Key
  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      schema:
        type: string
    Table:
      name: table
      in: path
      required: true
      schema:
        type: string
    Bucket:
      name: bucket
      in: path
      required: true
      schema:
        type: string
    ObjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    FunctionName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AuthCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    SessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
    SessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
    AdminUsersResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
    EnqueuePushRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        user_id:
          type: string
          nullable: true
    UserSummary:
      type: object
      required: [id, app_id, email, is_active, is_admin, admin_role]
      properties:
        id:
          type: string
        app_id:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        is_admin:
          type: boolean
        admin_role:
          type: string
          enum: [owner, developer, operator, viewer]
    RestoreBackupRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          description: Must exactly match the backup file name.
        reason:
          type: string
          nullable: true
    UpdateAdminRoleRequest:
      type: object
      required: [admin_role]
      properties:
        admin_role:
          type: string
          enum: [owner, developer, operator, viewer]
    CreateBetaInviteRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
        email:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
        max_uses:
          type: integer
          minimum: 1
        expires_in_days:
          type: integer
          minimum: 1
    BetaSignupRequest:
      type: object
      required: [invite_code, organization_name, email, password]
      properties:
        invite_code:
          type: string
        organization_name:
          type: string
        email:
          type: string
        password:
          type: string
    OrganizationSummary:
      type: object
      required: [id, name, display_name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        suspended_at:
          type: string
          nullable: true
        suspended_reason:
          type: string
          nullable: true
    SetQuotaRequest:
      type: object
      required: [quota_key, limit]
      properties:
        quota_key:
          type: string
          enum: [apps, app_users, data_rows, storage_bytes, function_invocations_month, push_sends_month, api_requests_month]
        limit:
          type: integer
          minimum: 0
    SuspendRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    QuotaSummary:
      type: object
      required: [quota_key, used, limit]
      properties:
        quota_key:
          type: string
        used:
          type: integer
        limit:
          type: integer
        reset_at:
          type: string
          nullable: true
    CreateAppRequest:
      type: object
      required: [name, display_name]
      properties:
        organization_id:
          type: string
          nullable: true
        name:
          type: string
        display_name:
          type: string
    CreateAppKeyRequest:
      type: object
      required: [name, key_type]
      properties:
        name:
          type: string
        key_type:
          type: string
          enum: [client, server, admin]
        scopes:
          type: array
          items:
            type: string
        expires_in_days:
          type: integer
        rate_limit_per_minute:
          type: integer
