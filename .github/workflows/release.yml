name: release

on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/parkjangwon/peanut

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Preflight tests
        run: cargo test -- --test-threads=1
      - name: OpenAPI lint
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Smoke released image
        env:
          JWT_SECRET: release-smoke-secret-that-is-long-enough
          DATABASE_URL: sqlite://release-ci/peanut.db
          STORAGE_DIR: release-ci/storage
          BIND_ADDR: 127.0.0.1:3000
          FUNCTIONS_ENABLED: "false"
        run: |
          mkdir -p release-ci
          docker run --rm -d \
            --name peanut-release-smoke \
            -p 127.0.0.1:3000:3000 \
            -e JWT_SECRET \
            -e DATABASE_URL \
            -e STORAGE_DIR \
            -e BIND_ADDR=0.0.0.0:3000 \
            -e FUNCTIONS_ENABLED \
            $IMAGE_NAME:$VERSION
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/ready | jq -e '.status == "ready"' >/dev/null; then
              docker stop peanut-release-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs peanut-release-smoke
          docker stop peanut-release-smoke || true
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cat > release-notes.md <<EOF
          Image: \`${IMAGE_NAME}:${VERSION}\`
          Digest: \`${DIGEST}\`

          Smoke verification: passed
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file release-notes.md
