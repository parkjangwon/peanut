name: smoke

on:
  pull_request:
  push:
    branches:
      - master
      - codex/**

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Compile tests
        run: cargo test --no-run

      - name: Start Peanut
        env:
          JWT_SECRET: ci-secret-that-is-long-enough
          DATABASE_URL: sqlite://ci-data/peanut.db
          STORAGE_DIR: ci-data/storage
          BIND_ADDR: 127.0.0.1:3000
          FUNCTIONS_ENABLED: "false"
          RUST_LOG: info
        run: |
          mkdir -p ci-data
          cargo run > ci-peanut.log 2>&1 &
          echo $! > ci-peanut.pid

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/ready | jq -e '.status == "ready"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ci-peanut.log
          exit 1

      - name: Bootstrap admin
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/register \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"secret123"}' | jq .

          login_json=$(curl -fsS -X POST http://127.0.0.1:3000/api/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"secret123"}')
          echo "$login_json" | jq .
          echo "ADMIN_JWT=$(echo "$login_json" | jq -r '.access_token')" >> "$GITHUB_ENV"

      - name: OpenAPI contract checks
        run: scripts/check-openapi.sh

      - name: Operations happy path
        env:
          ADMIN_JWT: ${{ env.ADMIN_JWT }}
        run: examples/operations-e2e/run-happy-path.sh

      - name: Stop Peanut
        if: always()
        run: |
          if [ -f ci-peanut.pid ]; then
            kill "$(cat ci-peanut.pid)" || true
          fi
